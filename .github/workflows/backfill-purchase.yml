name: Backfill Purchase Stats

on:
  workflow_dispatch:
    inputs:
      steamid:
        description: "Buyer's SteamID64"
        required: true
      appid:
        description: "Game's Steam appid"
        required: true
      game_name:
        description: "Override game name (optional — auto-fetched from Steam if left empty)"
        required: false
      price:
        description: "Manual price override (optional — only needed if automatic lookup fails, e.g. '62.90')"
        required: false
      currency:
        description: "Currency code for the manual price above (optional, e.g. BRL)"
        required: false
      notify:
        description: "Also post a Discord message about this backfilled purchase"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run backfill
        env:
          STEAM_MEMBERS: ${{ secrets.STEAM_MEMBERS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MESSAGE_LANGUAGE: ${{ secrets.MESSAGE_LANGUAGE }}
          STORE_COUNTRY_CODE: ${{ secrets.STORE_COUNTRY_CODE }}
        run: |
          CMD=(node dist/cli/backfill-purchase.js --steamid "${{ inputs.steamid }}" --appid "${{ inputs.appid }}")
          if [ -n "${{ inputs.game_name }}" ]; then
            CMD+=(--game-name "${{ inputs.game_name }}")
          fi
          if [ -n "${{ inputs.price }}" ]; then
            CMD+=(--price "${{ inputs.price }}")
          fi
          if [ -n "${{ inputs.currency }}" ]; then
            CMD+=(--currency "${{ inputs.currency }}")
          fi
          if [ "${{ inputs.notify }}" = "true" ]; then
            CMD+=(--notify)
          fi
          npm run build
          "${CMD[@]}"

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          git diff --staged --quiet || git commit -m "Backfill purchase stats"
          git push
