name: Steam Family Notifier

on:
  schedule:
    # Every 15 minutes.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-new-games:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run check
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STEAM_MEMBERS: ${{ secrets.STEAM_MEMBERS }}
          MESSAGE_LANGUAGE: ${{ secrets.MESSAGE_LANGUAGE }}
          STORE_COUNTRY_CODE: ${{ secrets.STORE_COUNTRY_CODE }}
        run: python check_new_games.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json stats.json
          git diff --staged --quiet || git commit -m "Update Steam library state and stats"
          git push